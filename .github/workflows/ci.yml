name: ci

# The same check to run locally before pushing: ./gradlew testDebugUnitTest assembleRelease
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests and release build
        run: ./gradlew testDebugUnitTest assembleRelease --console=plain
      - name: homectl syntax
        run: bash -n homectl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-and-screens
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/roborazzi/
          if-no-files-found: ignore
